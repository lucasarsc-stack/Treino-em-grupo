<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fichas de Treino</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Segoe UI', Arial, sans-serif;
    background: #0d0714;
    color: #fff;
    transition: background .3s, color .3s;
    padding-bottom: 60px;
  }

  .home-screen {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px;
    text-align: center;
    background: radial-gradient(circle at 50% 20%, rgba(162,89,255,.25), transparent 60%), #0d0714;
  }
  .home-title {
    font-size: 30px;
    letter-spacing: 1px;
    margin: 0 0 40px;
    color: #a259ff;
    text-shadow: 0 0 18px rgba(162,89,255,.6);
  }
  .home-names {
    display: flex;
    flex-direction: column;
    gap: 16px;
    width: 100%;
    max-width: 340px;
  }
  .home-btn {
    padding: 16px;
    border-radius: 12px;
    border: 1px solid rgba(162,89,255,.5);
    background: rgba(162,89,255,.12);
    color: #fff;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
  }
  .home-btn:active { background: rgba(162,89,255,.3); }
  .tabs {
    display: flex;
    position: sticky;
    top: 0;
    z-index: 10;
    background: #000;
  }
  .tab {
    flex: 1;
    padding: 16px 8px;
    text-align: center;
    cursor: pointer;
    font-weight: bold;
    border-bottom: 3px solid transparent;
    opacity: .6;
  }
  .tab.active { opacity: 1; }
  .container { max-width: 640px; margin: 0 auto; padding: 20px; display: none; }
  .container.active { display: block; }

  h1 { font-size: 22px; margin: 0 0 4px; }
  h2 { font-size: 17px; margin: 24px 0 10px; }
  .sub { opacity: .75; font-size: 13px; margin-bottom: 18px; }

  .card {
    background: rgba(255,255,255,.06);
    border: 1px solid rgba(255,255,255,.15);
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 16px;
  }
  .field { margin-bottom: 12px; }
  .field label { display: block; font-size: 13px; margin-bottom: 5px; opacity: .85; }
  .field input {
    width: 100%;
    padding: 10px;
    border-radius: 8px;
    border: 1px solid rgba(255,255,255,.25);
    background: rgba(255,255,255,.08);
    color: #fff;
    font-size: 14px;
  }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

  .exercise {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 4px;
    border-bottom: 1px solid rgba(255,255,255,.1);
    font-size: 14px;
  }
  .exercise:last-child { border-bottom: none; }
  .exercise input[type=checkbox] { width: 20px; height: 20px; flex-shrink: 0; }
  .exercise .name { flex: 1; }
  .exercise .sets { opacity: .7; font-size: 13px; white-space: nowrap; }
  .exercise.done .name { text-decoration: line-through; opacity: .5; }

  .btn {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 10px;
    font-weight: bold;
    font-size: 15px;
    cursor: pointer;
    margin-top: 8px;
  }
  .btn:disabled { opacity: .4; cursor: not-allowed; }

  .print-area {
    border: 2px dashed rgba(255,255,255,.4);
    border-radius: 12px;
    padding: 20px;
    margin-top: 24px;
    text-align: center;
  }
  .print-area .row { font-size: 15px; margin: 8px 0; }
  .print-area .row b { font-size: 17px; }
  .badge {
    display: inline-block;
    padding: 4px 12px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: bold;
    margin-bottom: 10px;
  }

  /* THEMES */
  .theme-lucas .tabs .tab.active { border-color: #ffe600; color: #ffe600; }
  .theme-lucas .btn.primary { background: #ffe600; color: #000; }
  .theme-lucas .badge { background: #ffe600; color: #000; }
  .theme-lucas .exercise.done { color: #ffe600; }

  .theme-nathan { }
  .theme-nathan .tabs .tab.active,
  .tabs .tab.active { border-color: #a259ff; color: #a259ff; }
  .theme-nathan .btn.primary,
  .btn.primary { background: #a259ff; color: #fff; }
  .theme-nathan .badge,
  .badge { background: #a259ff; color: #fff; }
  .theme-nathan .exercise.done,
  .exercise.done { color: #cba3ff; }
  .theme-nathan .card,
  .card { background: rgba(162,89,255,.08); border-color: rgba(162,89,255,.3); }
  .water-bar-fill { background: #a259ff; }

  .theme-angelica .tabs .tab.active { border-color: #ff4fa3; color: #ff4fa3; }
  .theme-angelica .btn.primary { background: #ff4fa3; color: #fff; }
  .theme-angelica .badge { background: #ff4fa3; color: #fff; }
  .theme-angelica .exercise.done { color: #ff9ecb; }
  .theme-angelica .card { background: rgba(255,79,163,.08); border-color: rgba(255,79,163,.3); }

  .btn.secondary { background: transparent; border: 1px solid rgba(255,255,255,.3); color: #fff; }

  .water-bar-bg {
    width: 100%;
    height: 14px;
    border-radius: 8px;
    background: rgba(255,255,255,.12);
    overflow: hidden;
    margin: 10px 0;
  }
  .water-bar-fill {
    height: 100%;
    background: #3aa0ff;
    border-radius: 8px;
    transition: width .3s;
  }
  .theme-lucas .water-bar-fill { background: #ffe600; }
  .theme-nathan .water-bar-fill { background: #a259ff; }
  .theme-angelica .water-bar-fill { background: #ff4fa3; }
  .water-row { display: flex; justify-content: space-between; align-items: center; font-size: 14px; margin-bottom: 4px; }
  .water-buttons { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
  .water-buttons .btn { flex: 1; min-width: 70px; margin-top: 0; padding: 10px 4px; font-size: 13px; }
</style>
</head>
<body>

<div id="home" class="home-screen">
  <h1 class="home-title">TREINO DOS CAMPEÕES</h1>
  <div class="home-names">
    <button class="home-btn" data-person="lucas">Lucas Cruz</button>
    <button class="home-btn" data-person="angelica">Angelica</button>
    <button class="home-btn" data-person="nathan">Nathan</button>
  </div>
</div>

<div class="tabs" id="tabs" style="display:none;">
  <div class="tab" data-person="lucas">Lucas Cruz</div>
  <div class="tab" data-person="angelica">Angelica</div>
  <div class="tab" data-person="nathan">Nathan</div>
</div>

<div id="app"></div>

<script>
const FICHAS = {
  nathan: {
    order: ['A','B','C','D','E'],
    dias: {
      A: { titulo: 'PEITO + TRÍCEPS', dia: 'SEGUNDA', ex: [
        ['Supino máquina','4x8–12'],['Supino inclinado máquina','3x8–12'],['Peck deck','3x10–15'],
        ['Crossover','3x10–15'],['Tríceps pulley','3x8–12'],['Tríceps máquina','3x10–15']]},
      B: { titulo: 'COSTAS + BÍCEPS', dia: 'TERÇA', ex: [
        ['Puxada frontal','4x8–12'],['Remada máquina','4x8–12'],['Remada baixa','3x10–12'],
        ['Pulldown','3x10–15'],['Rosca Scott máquina','3x8–12'],['Rosca polia','3x10–15']]},
      C: { titulo: 'PERNAS', dia: 'QUARTA', ex: [
        ['Leg press','4x8–12'],['Hack squat','4x8–12'],['Cadeira extensora','3x10–15'],
        ['Cadeira flexora','4x10–15'],['Glúteo máquina','3x10–15'],['Panturrilha','4x12–20']]},
      D: { titulo: 'OMBROS + BRAÇOS', dia: 'QUINTA', ex: [
        ['Desenvolvimento máquina','4x8–12'],['Elevação lateral máquina','4x10–15'],['Crucifixo inverso','3x12–15'],
        ['Rosca Scott','3x8–12'],['Rosca polia','3x10–15'],['Tríceps pulley','3x8–12'],['Tríceps corda','3x10–15']]},
      E: { titulo: 'FULL UPPER', dia: 'SEXTA', ex: [
        ['Supino máquina','3x8–12'],['Puxada frontal','3x8–12'],['Remada máquina','3x10–12'],
        ['Supino inclinado','3x10–12'],['Elevação lateral','3x12–15'],['Rosca máquina/polia','3x10–12'],['Tríceps corda','3x10–12']]}
    }
  },
  padrao: {
    order: ['A','B','C','D','E','F'],
    dias: {
      A: { titulo: 'PEITO + TRÍCEPS', dia: 'SEGUNDA', ex: [
        ['Supino máquina','4x8–12'],['Supino inclinado máquina','3x8–12'],['Crucifixo máquina','3x10–15'],
        ['Crossover na polia','3x10–15'],['Tríceps pulley','3x8–12'],['Tríceps máquina','3x10–12'],['Tríceps corda','3x12–15']]},
      B: { titulo: 'COSTAS + BÍCEPS', dia: 'TERÇA', ex: [
        ['Puxada frontal','4x8–12'],['Remada articulada/máquina','4x8–12'],['Remada baixa','3x10–12'],
        ['Pulldown máquina','3x10–15'],['Rosca Scott máquina','3x8–12'],['Rosca na polia','3x10–12'],['Rosca martelo na polia','3x10–15']]},
      C: { titulo: 'PERNAS', dia: 'QUARTA', ex: [
        ['Leg press 45°','4x8–12'],['Agachamento no Smith','4x8–12'],['Cadeira extensora','3x10–15'],
        ['Cadeira flexora','3x10–15'],['Hack squat','3x8–12'],['Panturrilha no leg press','4x12–15'],['Abdutora','3x12–20']]},
      D: { titulo: 'OMBROS + PEITO', dia: 'QUINTA', ex: [
        ['Desenvolvimento máquina','4x8–12'],['Elevação lateral máquina','4x10–15'],['Crucifixo inverso máquina','3x12–15'],
        ['Supino inclinado máquina','3x8–12'],['Peck deck','3x10–15'],['Elevação lateral na polia','3x12–15']]},
      E: { titulo: 'COSTAS + BRAÇOS', dia: 'SEXTA', ex: [
        ['Puxada articulada','4x8–12'],['Remada máquina','4x8–12'],['Pullover máquina','3x10–15'],
        ['Rosca Scott máquina','3x8–12'],['Rosca polia','3x10–15'],['Tríceps máquina','3x8–12'],['Tríceps corda','3x10–15']]},
      F: { titulo: 'PERNAS', dia: 'SÁBADO', ex: [
        ['Hack squat','4x8–12'],['Leg press','4x10–12'],['Cadeira extensora','3x12–15'],
        ['Mesa/cadeira flexora','4x10–15'],['Glúteo máquina','3x10–15'],['Abdutora','3x15–20'],['Panturrilha máquina','4x12–20']]}
    }
  }
};
FICHAS.lucas = FICHAS.padrao;
FICHAS.angelica = FICHAS.padrao;

const PEOPLE = ['lucas','angelica','nathan'];
let current = 'lucas';
let state = {}; // per person: {done, letra, weight, height, measure, goal, checks:[], water}

async function loadState(p) {
  try {
    const r = await window.storage.get('ficha_estado_' + p, true);
    const st = r ? JSON.parse(r.value) : { done: [], letra: null, weight:'', height:'', measure:'', goal:'', checks:[] };
    if (!st.done) st.done = [];
    if (st.letra === undefined) st.letra = null;
    if (!st.water) st.water = { goal: 2000, current: 0, date: '' };
    const today = new Date().toISOString().slice(0,10);
    if (st.water.date !== today) { st.water.current = 0; st.water.date = today; }
    return st;
  } catch(e) { return { done: [], letra: null, weight:'', height:'', measure:'', goal:'', checks:[], water:{goal:2000,current:0,date:new Date().toISOString().slice(0,10)} }; }
}
async function saveState(p) {
  try { await window.storage.set('ficha_estado_' + p, JSON.stringify(state[p]), true); } catch(e) {}
}

function render() {
  const app = document.getElementById('app');
  const p = current;
  const st = state[p];
  const order = FICHAS[p].order;
  const nomes = { lucas:'Lucas Cruz', angelica:'Angelica', nathan:'Nathan' };

  const letraSelectorHtml = `
    <h2>Ficha de hoje</h2>
    <div class="sub">Fichas restantes neste ciclo — toque para escolher</div>
    <div class="card" style="display:flex; flex-wrap:wrap; gap:8px;">
      ${order.map(l => {
        const feita = st.done.includes(l);
        return `<button class="btn ${feita?'secondary':'primary'}" data-letra="${l}" style="flex:1; min-width:60px; margin-top:0; ${feita?'opacity:.35; text-decoration:line-through;':''}" ${feita?'disabled':''}>${l}</button>`;
      }).join('')}
    </div>`;

  // Bloco fixo: aparece sempre que a pessoa é selecionada, independente da ficha
  const dadosFixosHtml = `
    <h2>Seus dados</h2>
    <div class="card">
      <div class="grid2">
        <div class="field"><label>Peso (kg)</label><input type="number" id="in-weight" value="${st.weight}"></div>
        <div class="field"><label>Altura (cm)</label><input type="number" id="in-height" value="${st.height}"></div>
        <div class="field"><label>Medida (cintura, cm)</label><input type="number" id="in-measure" value="${st.measure}"></div>
        <div class="field"><label>Objetivo de peso (kg)</label><input type="number" id="in-goal" value="${st.goal}"></div>
      </div>
      <div class="field"><label>Horas treinadas hoje</label><input type="number" step="0.1" id="in-hours" value="${st.hours||''}"></div>
      <div class="row" style="font-size:14px; opacity:.85;">Calorias estimadas: <b id="kcal-preview">${calcKcal(st.weight, st.hours)}</b> kcal</div>
    </div>

    <h2>Água</h2>
    <div class="card">
      <div class="water-row">
        <span>Meta diária:</span>
        <input type="number" id="in-water-goal" value="${st.water.goal}" style="width:90px; padding:6px; border-radius:6px; border:1px solid rgba(255,255,255,.25); background:rgba(255,255,255,.08); color:#fff;"> ml
      </div>
      <div class="water-row"><b>${st.water.current} ml</b><span>${Math.min(100, Math.round(st.water.current/st.water.goal*100)||0)}%</span></div>
      <div class="water-bar-bg"><div class="water-bar-fill" style="width:${Math.min(100, st.water.current/st.water.goal*100||0)}%;"></div></div>
      <div class="water-buttons">
        <button class="btn secondary" data-add="200">+200ml</button>
        <button class="btn secondary" data-add="300">+300ml</button>
        <button class="btn secondary" data-add="500">+500ml</button>
        <button class="btn secondary" data-add="-200">-200ml</button>
      </div>
    </div>`;

  // Caso não haja ficha escolhida (ou já concluída): mostra dados fixos + seletor de ficha, sem lista de exercícios
  if (!st.letra || st.done.includes(st.letra)) {
    app.innerHTML = `
    <div class="container active">
      <h1>${nomes[p]}</h1>
      ${dadosFixosHtml}
      ${letraSelectorHtml}
    </div>`;
    bindCommon(p, st);
    return;
  }

  const letra = st.letra;
  const ficha = FICHAS[p].dias[letra];

  const totalEx = ficha.ex.length;
  const marcados = st.checks.filter(Boolean).length;
  const completo = marcados === totalEx;

  app.innerHTML = `
  <div class="container active">
    <h1>${nomes[p]}</h1>
    ${dadosFixosHtml}
    ${letraSelectorHtml}
    <div class="sub">${ficha.dia} — FICHA ${letra} · ${ficha.titulo}</div>

    <h2>Ficha ${letra} — ${ficha.titulo}</h2>
    <div class="card">
      ${ficha.ex.map((e,i)=>`
        <div class="exercise ${st.checks[i]?'done':''}">
          <input type="checkbox" data-idx="${i}" ${st.checks[i]?'checked':''}>
          <div class="name">${i+1}. ${e[0]}</div>
          <div class="sets">${e[1]}</div>
        </div>`).join('')}
    </div>

    <button class="btn primary" id="btn-concluir" ${!completo?'disabled':''}>
      ${completo ? 'Concluir treino e gerar resumo' : `Marque todos os exercícios (${marcados}/${totalEx})`}
    </button>

    <div class="print-area" id="print-area" style="display:none;">
      <span class="badge">TREINO CONCLUÍDO</span>
      <div class="row">Tempo total treino: <b id="p-tempo"></b></div>
      <div class="row">Calorias gastas: <b id="p-kcal"></b></div>
      <div class="row">Ficha escolhida: <b id="p-ficha"></b></div>
      <div class="row">Água consumida: <b id="p-water"></b></div>
    </div>
  </div>`;

  bindCommon(p, st);

  document.querySelectorAll('.exercise input[type=checkbox]').forEach(cb=>{
    cb.addEventListener('change', e=>{
      const idx = +e.target.dataset.idx;
      st.checks[idx] = e.target.checked;
      saveState(p);
      render();
    });
  });

  document.getElementById('btn-concluir').addEventListener('click', async ()=>{
    const kcal = calcKcal(st.weight, st.hours);
    const tempo = st.hours ? st.hours + 'h' : '-';
    document.getElementById('p-tempo').textContent = tempo;
    document.getElementById('p-kcal').textContent = kcal + ' kcal';
    document.getElementById('p-ficha').textContent = 'Ficha ' + letra + ' — ' + ficha.titulo;
    document.getElementById('p-water').textContent = st.water.current + ' / ' + st.water.goal + ' ml';
    document.getElementById('print-area').style.display = 'block';
    document.getElementById('print-area').scrollIntoView({behavior:'smooth'});

    st.done.push(letra);
    if (st.done.length >= FICHAS[p].order.length) st.done = [];
    st.letra = null;
    st.checks = [];
    st.hours = '';
    await saveState(p);
  });
}

// Liga os eventos que existem em toda tela (seletor de ficha + dados fixos + água)
function bindCommon(p, st) {
  document.querySelectorAll('[data-letra]').forEach(b=>{
    b.addEventListener('click', ()=>{ st.letra = b.dataset.letra; st.checks = []; saveState(p); render(); });
  });
  document.getElementById('in-weight').addEventListener('input', e=>{ st.weight=e.target.value; saveState(p); updateKcalPreview(); });
  document.getElementById('in-height').addEventListener('input', e=>{ st.height=e.target.value; saveState(p); });
  document.getElementById('in-measure').addEventListener('input', e=>{ st.measure=e.target.value; saveState(p); });
  document.getElementById('in-goal').addEventListener('input', e=>{ st.goal=e.target.value; saveState(p); });
  document.getElementById('in-hours').addEventListener('input', e=>{ st.hours=e.target.value; saveState(p); updateKcalPreview(); });
  document.getElementById('in-water-goal').addEventListener('input', e=>{ st.water.goal = parseInt(e.target.value)||1; saveState(p); render(); });
  document.querySelectorAll('.water-buttons [data-add]').forEach(b=>{
    b.addEventListener('click', ()=>{
      st.water.current = Math.max(0, st.water.current + parseInt(b.dataset.add));
      st.water.date = new Date().toISOString().slice(0,10);
      saveState(p);
      render();
    });
  });
}

function calcKcal(weight, hours) {
  const w = parseFloat(weight); const h = parseFloat(hours);
  if (!w || !h) return 0;
  return Math.round(6 * w * h); // MET ~6 para musculação
}
function updateKcalPreview() {
  const st = state[current];
  const el = document.getElementById('kcal-preview');
  if (el) el.textContent = calcKcal(st.weight, st.hours);
}

async function selectPerson(p) {
  current = p;
  document.getElementById('home').style.display = 'none';
  document.getElementById('tabs').style.display = 'flex';
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active', t.dataset.person===p));
  document.body.className = 'theme-' + p;
  if (!state[p]) state[p] = await loadState(p);
  render();
}

document.querySelectorAll('.tab').forEach(t=>{
  t.addEventListener('click', ()=> selectPerson(t.dataset.person));
});
document.querySelectorAll('.home-btn').forEach(b=>{
  b.addEventListener('click', ()=> selectPerson(b.dataset.person));
});

(async ()=>{
  for (const p of PEOPLE) state[p] = await loadState(p);
})();
</script>
</body>
</html>
